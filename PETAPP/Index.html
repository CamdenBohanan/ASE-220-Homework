<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>Leeroy's Adoption Center - Homepage</title>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css?family=Playfair+Display:400,700%7CRoboto:300,400,500,700,900&display=swap"
        rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="Style/bootstrap.css">
    <link rel="stylesheet" href="Style/fontawesome.css">
    <link rel="stylesheet" href="Style/style.css">
    <link rel="stylesheet" href="Style/plugins.css">
    <link rel="stylesheet" href="Style/color.css">
    <link rel="stylesheet" href="Style/responsive.css">
</head>

<body>
    <!-- Header -->
    <header id="header" class="pt-lg-5 pt-md-3 pt-2 position-absolute w-100">
        <div class="container-fluid px-xl-17 px-lg-5 px-md-3 px-0 d-flex flex-wrap">
            <div class="col-6 col-sm-3 col-lg-2 order-sm-2 order-md-0 dis-none"></div>

            <div class="col-12 col-sm-6 col-lg-8 static-block">
                <div class="mainHolder justify-content-center">
                    <nav class="navbar navbar-expand-lg navbar-light p-0 pageNav1 position-static">
                        <div class="collapse navbar-collapse" id="navbarNav">
                            <ul class="navbar-nav mx-auto text-uppercase d-inline-block">
                                <li class="nav-item"><a class="d-block" href="">Home</a></li>
                                <li class="nav-item"><a class="d-block" href="">About</a></li>
                                <li class="nav-item"><a class="d-block" href="home.html">
                                        <h3>Leeroy's Adoption Center</h3>
                                    </a></li>
                                <li class="nav-item"><a class="d-block" href="">Index</a></li>
                                <li class="nav-item"><a class="d-block" href="contact-us.html">Contact</a></li>
                            </ul>
                        </div>
                    </nav>
                </div>
            </div>
        </div>
    </header>

    <!-- Feature Section -->
    <section
        class="featureSec container-fluid overflow-hidden pt-xl-12 pt-lg-10 pt-md-80 pt-5 pb-xl-10 pb-lg-4 pb-md-2 px-xl-14 px-lg-7">
        <div class="featureCol px-3 mb-6">
            <div class="border"></div>
        </div>
        <div class="col-12 p-0 overflow-hidden d-flex flex-wrap">

        </div>
    </section>

    <!-- Card Container Section -->
    <div class="container my-4">
        <div id="cards-container" class="row row-cols-1 row-cols-md-3 g-4"></div>

        <div class="d-flex justify-content-center mt-4">
            <button id="load-more-btn" class="btn btn-success mx-2">Load More</button>
            <button id="create-btn" class="btn btn-primary mx-2" onclick="Creationmodal()">Create</button>
        </div>
    </div>



    <!-- Modal -->
    <div class="modal fade" id="createmodal" tabindex="-1" aria-labelledby="crModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title" id="crModalLabel">Fill Out Info</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <form id="PetForm">
                        <div class="mb-3">
                            <label for="petName" class="form-label">Pet Name</label>
                            <input type="text" class="form-control" id="petName" required>
                        </div>
                        <div class="mb-3">
                            <label for="petAge" class="form-label">Pet Age</label>
                            <input type="number" class="form-control" id="petAge" required>
                        </div>
                        <div class="mb-3">
                            <label for="petBreed" class="form-label">Pet Breed</label>
                            <input type="text" class="form-control" id="petBreed" required>
                        </div>
                        <div class="mb-3">
                            <label for="petSex" class="form-label">Pet Sex</label>
                            <select type="text" class="form-control" id="petSex" required>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                            </select>
                        </div>
                    </form>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-success" form="PetForm">Submit</button>
                </div>

            </div>
        </div>
    </div>


    <!-- Scripts -->
    <script src="Index.js"></script>
    <script src="Script/jquery-3.4.1.js"></script>
    <script src="Script/popper.min.js"></script>
    <script src="Script/bootstrap.min.js"></script>
    <script src="Script/jqueryCustome.js"></script>
</body>

</html>
